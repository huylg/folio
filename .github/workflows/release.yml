name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (must already exist)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          echo "macOS SDK: $sdk"
          # Liquid Glass is granted by SDK linkage, not by the deployment target: a
          # binary built against SDK 15 keeps the pre-26 appearance even when it runs
          # on macOS 26. Fail here rather than shipping a bundle that looks stale.
          [ "${sdk%%.*}" -ge 26 ] || { echo "::error::need the macOS 26 SDK or newer, got $sdk"; exit 1; }

      - name: Test
        run: make test

      - name: Build the release app and disk image
        id: archive
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          name="Folio-$tag.dmg"
          make dmg CONFIG=release
          mv build/Folio.dmg "$name"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=$name" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.archive.outputs.tag }}"
          asset="${{ steps.archive.outputs.asset }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" \
              --title "Folio $tag" \
              --generate-notes
          fi
