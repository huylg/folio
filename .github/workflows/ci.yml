name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          echo "macOS SDK: $sdk"
          # Liquid Glass is granted by SDK linkage, not by the deployment target: a
          # binary built against SDK 15 keeps the pre-26 appearance even when it runs
          # on macOS 26. Fail here rather than shipping a bundle that looks stale.
          [ "${sdk%%.*}" -ge 26 ] || { echo "::error::need the macOS 26 SDK or newer, got $sdk"; exit 1; }

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-${{ hashFiles('Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-
            spm-${{ runner.os }}-

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Collect test crash reports
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import time

          reports = Path.home() / "Library/Logs/DiagnosticReports"
          output = Path("build/test-crashes")
          output.mkdir(parents=True, exist_ok=True)
          # ReportCrash can finish writing after xctest has exited.
          for attempt in range(10):
              crashes = [path for path in reports.glob("*")
                         if path.name.lower().startswith(("xctest", "foliopackagetests"))
                         and path.suffix in (".ips", ".crash")]
              if crashes:
                  for path in crashes:
                      shutil.copy2(path, output / path.name)
                  break
              time.sleep(1)
          PY

      - name: Capture test backtrace
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          bundle = Path(".build/debug/FolioPackageTests.xctest")
          if bundle.exists():
              output = Path("build/test-crashes")
              output.mkdir(parents=True, exist_ok=True)
              xctest = subprocess.check_output(["xcrun", "--find", "xctest"], text=True).strip()
              # Hosted runners may disable ReportCrash. Run the failing process under
              # LLDB as a fallback; this does not change the original test result.
              with (output / "backtrace.log").open("w") as log:
                  try:
                      subprocess.run(["xcrun", "lldb", "--batch", "-o", "run",
                                      "-o", "thread backtrace all", "--", xctest,
                                      str(bundle.resolve())], stdout=log, stderr=subprocess.STDOUT,
                                     timeout=180)
                  except subprocess.TimeoutExpired:
                      log.write("\nDiagnostic test run timed out.\n")
          PY

      - name: Upload test crash reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-crashes
          path: build/test-crashes
          if-no-files-found: ignore
          retention-days: 7

      - name: Package the app
        run: |
          make app
          # ditto, not zip: artifacts lose the executable bit unless the bundle
          # is archived before upload.
          ditto -c -k --keepParent build/Folio.app build/Folio.app.zip

      - name: Verify signed update packaging
        run: python3 Tools/test_sparkle_release.py

      - name: Upload the app bundle
        uses: actions/upload-artifact@v7
        with:
          name: Folio-app-debug
          path: build/Folio.app.zip
          if-no-files-found: error
